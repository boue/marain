[package]
name = "agent-idempotency"
version = "1.0.0"
edition = "2021"
description = "Idempotency wrappers for coding-agent API and database calls"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
hex = "0.4"
percent-encoding = "2"
redis = "0.27"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
